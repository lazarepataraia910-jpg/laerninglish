<!doctype html><html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:#f3f4f6;color:#111214;font:400 15px/1.45 "Noto Sans Georgian",system-ui,sans-serif;padding:0 14px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.top{display:flex;align-items:center;gap:10px;padding:16px 2px 12px}
.top b{font-size:16px;font-weight:800;line-height:1.1}.top small{display:block;font-size:10px;font-weight:800;letter-spacing:.14em;color:#e0262b}
.av{margin-left:auto;width:38px;height:38px;border-radius:50%;background:#ffe8e8;display:grid;place-items:center;color:#e0262b}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.w{background:#fff;border-radius:22px;padding:14px;display:grid;gap:6px}
.w .k{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#6b6f78}
.w .v{font-size:30px;font-weight:800;line-height:1}
.ring{width:54px;height:54px;border-radius:50%;background:conic-gradient(#e0262b 60%,#f0e1e1 0);display:grid;place-items:center}
.ring span{width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
.big{margin-top:10px;background:#e0262b;color:#fff;border-radius:26px;padding:20px}
.big .k{color:#ffd9d9;font-size:13px;font-weight:600}
.big h1{font-size:42px;font-weight:800;margin:4px 0 0}.big p{font-size:17px;color:#ffe3e3}
.big .row{display:flex;align-items:center;justify-content:space-between;margin-top:16px}
.track{flex:1;height:8px;border-radius:4px;background:rgb(255 255 255/.3);margin-right:14px}.track i{display:block;width:72%;height:100%;border-radius:4px;background:#fff}
.play{width:54px;height:54px;border-radius:50%;background:#fff;color:#e0262b;display:grid;place-items:center}
.play svg{fill:#e0262b;stroke:none}
h2{margin:20px 2px 10px;font-size:18px;font-weight:800}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.t{background:#fff;border-radius:22px;padding:14px;height:126px;display:flex;flex-direction:column;justify-content:space-between}
.t .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.t b{font-size:15px;font-weight:600}.t small{color:#6b6f78;font-size:12px}
.tabs{position:absolute;left:14px;right:14px;top:762px;height:66px;display:grid;grid-template-columns:repeat(4,1fr);background:#111214;border-radius:33px}
.tabs a{display:grid;place-items:center;color:#8a8e97}.tabs a.on{color:#fff}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="flame" viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.4-.5-2-1-3-1-2.1-.2-4 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.2.4-2.3 1-3 0 1.4.5 2.5 1.5 3.5z"/></symbol>
<symbol id="star" viewBox="0 0 24 24"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></symbol>
<symbol id="book" viewBox="0 0 24 24"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2zM22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></symbol>
<symbol id="cap" viewBox="0 0 24 24"><path d="M22 10 12 5 2 10l10 5 10-5zM6 12v5c3 3 9 3 12 0v-5"/></symbol>
<symbol id="chart" viewBox="0 0 24 24"><path d="M3 3v18h18M8 17v-4M13 17V7M18 17v-7"/></symbol>
<symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></symbol>
<symbol id="paw" viewBox="0 0 24 24"><circle cx="5" cy="10" r="2"/><circle cx="9" cy="5" r="2"/><circle cx="15" cy="5" r="2"/><circle cx="19" cy="10" r="2"/><path d="M12 12c-3 0-6 4-6 7 0 2 2 2 3 2s2-1 3-1 2 1 3 1 3 0 3-2c0-3-3-7-6-7z"/></symbol>
<symbol id="code" viewBox="0 0 24 24"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/></symbol>
<symbol id="play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></symbol>
</defs></svg>
<div class="top">
  <svg width="38" height="38" viewBox="0 0 40 40"><rect width="40" height="40" rx="9" fill="#e0262b"/><path d="M8 12h9a3 3 0 0 1 3 3v15a2 2 0 0 0-2-2H8zM32 12h-9a3 3 0 0 0-3 3v15a2 2 0 0 1 2-2h10z" fill="#fff"/><path d="M25 12h4v9l-2-1.5-2 1.5z" fill="#e0262b"/></svg>
  <div><small>LEARN ENGLISH</small><b>ისწავლე ინგლისური</b></div>
  <span class="av"><svg class="i"><use href="#user"/></svg></span>
</div>
<div class="grid">
  <div class="w"><span class="k"><svg class="i" style="color:#e0262b;width:16px;height:16px"><use href="#flame"/></svg>სერია</span><span class="v">5</span></div>
  <div class="w"><span class="k"><svg class="i" style="color:#e0a400;width:16px;height:16px"><use href="#star"/></svg>XP</span><span class="v">186</span></div>
  <div class="w" style="place-items:center"><div class="ring"><span>18/30</span></div></div>
</div>
<div class="big"><span class="k">ცხოველები · გადაწერა</span><h1>elephant</h1><p>სპილო</p>
  <div class="row"><div class="track"><i></i></div><span class="play"><svg class="i"><use href="#play"/></svg></span></div></div>
<h2>ჩემი გაკვეთილები</h2>
<div class="tiles">
  <div class="t"><span class="ic" style="background:#ffe8e8;color:#e0262b"><svg class="i"><use href="#paw"/></svg></span><div><b>ცხოველები</b><br><small>12 სიტყვა</small></div></div>
  <div class="t"><span class="ic" style="background:#e6efff;color:#2f6fde"><svg class="i"><use href="#code"/></svg></span><div><b>1. საფუძვლები</b><br><small>20 სიტყვა</small></div></div>
  <div class="t"><span class="ic" style="background:#fff3c4;color:#9a7300"><svg class="i"><use href="#cap"/></svg></span><div><b>A2 სიტყვები</b><br><small>20 სიტყვა</small></div></div>
  <div class="t"><span class="ic" style="background:#e3f6ea;color:#1a8a4f"><svg class="i"><use href="#book"/></svg></span><div><b>ფერები</b><br><small>10 სიტყვა</small></div></div>
</div>
<nav class="tabs"><a class="on"><svg class="i"><use href="#book"/></svg></a><a><svg class="i"><use href="#cap"/></svg></a><a><svg class="i"><use href="#chart"/></svg></a><a><svg class="i"><use href="#user"/></svg></a></nav>
</body></html>
