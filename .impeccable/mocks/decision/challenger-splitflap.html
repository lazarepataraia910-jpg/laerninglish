<!doctype html>
<html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wdth,wght@62.5..100,100..900&display=swap" rel="stylesheet">
<style>
  :root { --flap:#161616; --steel:#2b2b2b; --ink:#f4f4f4; --red:#d62828; --mute:#8a8a8a; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 390px; height: 844px; overflow: hidden; background: var(--steel); color: var(--ink);
    font-family: "Noto Sans Georgian", system-ui, sans-serif; }
  .emo { font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif; }
  header { height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #0d0d0d; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 16px; font-stretch: 70%; letter-spacing: .08em; text-transform: uppercase; }
  .brand svg { width: 28px; height: 28px; }
  .stats { display: flex; gap: 12px; font-size: 14px; font-weight: 800; font-stretch: 70%; }
  .board { margin: 14px 12px 0; background: #0d0d0d; padding: 12px; }
  .cap { display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; color: var(--mute); letter-spacing: .12em; text-transform: uppercase; }
  .cells { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; margin-top: 10px; }
  .cells b { position: relative; height: 54px; display: grid; place-items: center; background: var(--flap); font-size: 34px; font-weight: 800; font-stretch: 65%; text-transform: uppercase; }
  .cells b::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: #000; }
  .cells b.bad { background: var(--red); } .cells b.empty { color: transparent; }
  .ka { margin-top: 10px; font-size: 20px; font-weight: 600; }
  .goal { display: flex; justify-content: space-between; margin-top: 10px; font-size: 13px; color: var(--mute); }
  .go { display: block; margin: 14px 12px 0; padding: 15px; background: var(--red); color: #fff; text-align: center; font-size: 18px; font-weight: 800; font-stretch: 75%; letter-spacing: .04em; }
  table { width: calc(100% - 24px); margin: 16px 12px 0; border-collapse: collapse; background: #0d0d0d; }
  th { font-size: 11px; font-weight: 700; color: var(--mute); text-align: left; letter-spacing: .12em; padding: 8px 10px; text-transform: uppercase; }
  td { padding: 11px 10px; border-top: 2px solid var(--steel); font-size: 15px; font-weight: 700; font-stretch: 80%; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; } td.done { color: var(--mute); }
  nav { position: absolute; left: 0; right: 0; bottom: 0; height: 68px; display: grid; grid-template-columns: repeat(4, 1fr); background: #0d0d0d; }
  nav a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 700; color: var(--mute); }
  nav a .emo { font-size: 20px; } nav a.on { color: #fff; box-shadow: inset 0 3px 0 var(--red); }
</style></head><body>
<header>
  <div class="brand"><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="2" y="2" width="44" height="44" rx="7" fill="#d62828" stroke="#111" stroke-width="3"/><path d="M24 15c-4-3-9-3.5-14-2v21c5-1.5 10-1 14 2z" fill="#fff" stroke="#111" stroke-width="2.6" stroke-linejoin="round"/><path d="M24 15c4-3 9-3.5 14-2v21c-5-1.5-10-1-14 2z" fill="#fff" stroke="#111" stroke-width="2.6" stroke-linejoin="round"/><path d="M30 12.2V22l2.5-2 2.5 2v-9.6" fill="#d62828" stroke="#111" stroke-width="2" stroke-linejoin="round"/></svg>English Quest</div>
  <div class="stats"><span><span class="emo">🔥</span> 5</span><span><span class="emo">⭐</span> 120</span><span>A2</span></div>
</header>
<div class="board">
  <div class="cap"><span><span class="emo">🐶</span> ცხოველები · ნაბიჯი 2</span><span>7 / 10</span></div>
  <div class="cells"><b>e</b><b>l</b><b class="bad">e</b><b>p</b><b>h</b><b>a</b><b>n</b><b>t</b></div>
  <p class="ka">სპილო</p>
  <div class="goal"><span>დღის მიზანი</span><span>18 / 30 XP</span></div>
</div>
<a class="go">▶ გაგრძელება</a>
<table>
  <tr><th>გაკვეთილი</th><th style="text-align:right">სიტყვა</th></tr>
  <tr><td><span class="emo">💻</span> 01 · საფუძვლები</td><td class="n">4 / 20</td></tr>
  <tr><td><span class="emo">🎓</span> A1 სიტყვები</td><td class="n">12 / 20</td></tr>
  <tr><td class="done"><span class="emo">🎨</span> ფერები</td><td class="n done">✔ 10 / 10</td></tr>
  <tr><td><span class="emo">🔢</span> რიცხვები</td><td class="n">0 / 10</td></tr>
</table>
<nav>
  <a class="on"><span class="emo">📚</span>გაკვეთილები</a><a><span class="emo">💻</span>კურსი</a>
  <a><span class="emo">📊</span>სტატისტიკა</a><a><span class="emo">⚙️</span>პარამეტრები</a>
</nav>
</body></html>
