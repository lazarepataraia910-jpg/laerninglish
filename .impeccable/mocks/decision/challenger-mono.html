<!doctype html><html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:#fafafa;color:#0a0a0a;font:400 15px/1.5 "Noto Sans Georgian",system-ui,sans-serif}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.top{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid #e5e5e5}
.top b{font-size:15px;font-weight:600}
.m{margin-left:auto;display:flex;gap:14px;color:#525252;font-size:14px}.m span{display:flex;align-items:center;gap:4px}
main{padding:28px 20px 0}
.cap{font-size:13px;color:#737373}
h1{font-size:52px;font-weight:600;letter-spacing:-.02em;margin:8px 0 0;line-height:1.1}
.ka{font-size:18px;color:#525252}
.prog{display:flex;gap:4px;margin:22px 0 8px}.prog i{flex:1;height:3px;background:#e5e5e5}.prog i.on{background:#0a0a0a}
.pm{display:flex;justify-content:space-between;font-size:13px;color:#737373}
.go{display:flex;align-items:center;justify-content:center;height:52px;margin-top:22px;background:#e0262b;color:#fff;font-weight:600;font-size:16px;border-radius:10px}
.sec{display:flex;justify-content:space-between;align-items:center;margin:34px 0 4px}
.sec h2{font-size:15px;font-weight:600}
.ghost{display:flex;align-items:center;gap:4px;height:34px;padding:0 12px;border:1px solid #d4d4d4;border-radius:8px;font-size:13px}
.row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid #e5e5e5}
.row svg{color:#525252}.row div{flex:1}.row b{font-weight:600}.row small{display:block;color:#737373;font-size:13px}
.row .c{font-size:13px;color:#525252}
.tabs{position:absolute;left:0;right:0;top:776px;height:68px;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #e5e5e5;background:#fafafa}
.tabs a{display:grid;justify-items:center;align-content:center;gap:2px;font-size:11px;color:#737373}.tabs a.on{color:#0a0a0a}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="flame" viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.4-.5-2-1-3-1-2.1-.2-4 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.2.4-2.3 1-3 0 1.4.5 2.5 1.5 3.5z"/></symbol>
<symbol id="star" viewBox="0 0 24 24"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></symbol>
<symbol id="book" viewBox="0 0 24 24"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2zM22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></symbol>
<symbol id="cap" viewBox="0 0 24 24"><path d="M22 10 12 5 2 10l10 5 10-5zM6 12v5c3 3 9 3 12 0v-5"/></symbol>
<symbol id="chart" viewBox="0 0 24 24"><path d="M3 3v18h18M8 17v-4M13 17V7M18 17v-7"/></symbol>
<symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></symbol>
<symbol id="plus" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></symbol>
</defs></svg>
<div class="top">
  <svg width="32" height="32" viewBox="0 0 40 40"><rect width="40" height="40" rx="9" fill="#e0262b"/><path d="M8 12h9a3 3 0 0 1 3 3v15a2 2 0 0 0-2-2H8zM32 12h-9a3 3 0 0 0-3 3v15a2 2 0 0 1 2-2h10z" fill="#fff"/><path d="M25 12h4v9l-2-1.5-2 1.5z" fill="#e0262b"/></svg>
  <b>ისწავლე ინგლისური</b>
  <div class="m"><span><svg class="i"><use href="#flame"/></svg>5</span><span><svg class="i"><use href="#star"/></svg>186</span></div>
</div>
<main>
  <p class="cap">ცხოველები — გადაწერა</p>
  <h1>elephant</h1><p class="ka">სპილო</p>
  <div class="prog"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i></div>
  <div class="pm"><span>9 / 12</span><span>დღის მიზანი 18 / 30</span></div>
  <a class="go">გაგრძელება</a>
  <div class="sec"><h2>ჩემი გაკვეთილები</h2><span class="ghost"><svg class="i"><use href="#plus"/></svg>ახალი</span></div>
  <div class="row"><svg class="i"><use href="#book"/></svg><div><b>ცხოველები</b><small>dog · cat · horse · cow</small></div><span class="c">12</span></div>
  <div class="row"><svg class="i"><use href="#book"/></svg><div><b>1. საფუძვლები</b><small>variable · function · loop</small></div><span class="c">20</span></div>
  <div class="row"><svg class="i"><use href="#cap"/></svg><div><b>A2 სიტყვები</b><small>always · borrow · cheap</small></div><span class="c">20</span></div>
</main>
<nav class="tabs"><a class="on"><svg class="i"><use href="#book"/></svg>გაკვეთილები</a><a><svg class="i"><use href="#cap"/></svg>კურსი</a><a><svg class="i"><use href="#chart"/></svg>სტატისტიკა</a><a><svg class="i"><use href="#user"/></svg>პროფილი</a></nav>
</body></html>
