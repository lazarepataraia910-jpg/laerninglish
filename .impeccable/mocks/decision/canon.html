<!doctype html><html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:#fff;color:#1f2937;font:400 15px/1.45 "Noto Sans Georgian",system-ui,sans-serif;padding:0 16px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.top{display:flex;align-items:center;gap:8px;padding:14px 0;border-bottom:2px solid #e5e7eb}
.chip{display:flex;align-items:center;gap:4px;font-weight:800}
.top .sp{flex:1}
.card{margin-top:16px;border:2px solid #e5e7eb;border-radius:18px;padding:18px;text-align:center}
.card .k{font-size:13px;font-weight:700;color:#6b7280}
.card h1{font-size:40px;font-weight:800;margin:6px 0 2px}.card p{color:#4b5563}
.bar{height:14px;border-radius:7px;background:#e5e7eb;margin:16px 0 0}.bar i{display:block;width:70%;height:100%;border-radius:7px;background:#58a6ff}
.go{display:block;margin-top:16px;height:54px;line-height:54px;text-align:center;border-radius:14px;background:#e0262b;color:#fff;font-weight:800;font-size:17px;box-shadow:0 4px 0 #a81b1f}
h2{margin:22px 0 10px;font-size:18px;font-weight:800}
.l{display:flex;align-items:center;gap:12px;border:2px solid #e5e7eb;border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:0 3px 0 #e5e7eb}
.l .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:#fff}
.l b{flex:1;font-weight:700}
.tabs{position:absolute;left:0;right:0;top:776px;height:68px;display:grid;grid-template-columns:repeat(4,1fr);border-top:2px solid #e5e7eb;background:#fff}
.tabs a{display:grid;place-items:center;color:#9ca3af}.tabs a.on{color:#e0262b}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="flame" viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.4-.5-2-1-3-1-2.1-.2-4 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.2.4-2.3 1-3 0 1.4.5 2.5 1.5 3.5z"/></symbol>
<symbol id="star" viewBox="0 0 24 24"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></symbol>
<symbol id="book" viewBox="0 0 24 24"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2zM22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></symbol>
<symbol id="cap" viewBox="0 0 24 24"><path d="M22 10 12 5 2 10l10 5 10-5zM6 12v5c3 3 9 3 12 0v-5"/></symbol>
<symbol id="chart" viewBox="0 0 24 24"><path d="M3 3v18h18M8 17v-4M13 17V7M18 17v-7"/></symbol>
<symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></symbol>
</defs></svg>
<div class="top">
  <svg width="34" height="34" viewBox="0 0 40 40"><rect width="40" height="40" rx="9" fill="#e0262b"/><path d="M8 12h9a3 3 0 0 1 3 3v15a2 2 0 0 0-2-2H8zM32 12h-9a3 3 0 0 0-3 3v15a2 2 0 0 1 2-2h10z" fill="#fff"/><path d="M25 12h4v9l-2-1.5-2 1.5z" fill="#e0262b"/></svg>
  <span class="sp"></span>
  <span class="chip" style="color:#f97316"><svg class="i"><use href="#flame"/></svg>5</span>
  <span class="chip" style="color:#eab308"><svg class="i"><use href="#star"/></svg>186</span>
</div>
<div class="card"><p class="k">ცხოველები · გადაწერა</p><h1>elephant</h1><p>სპილო</p><div class="bar"><i></i></div></div>
<a class="go">გაგრძელება</a>
<h2>ჩემი გაკვეთილები</h2>

<div class="l"><span class="ic" style="background:#58a6ff"><svg class="i"><use href="#book"/></svg></span><b>1. საფუძვლები</b>20</div>
<div class="l"><span class="ic" style="background:#22c55e"><svg class="i"><use href="#cap"/></svg></span><b>A2 სიტყვები</b>20</div>

</body></html>
